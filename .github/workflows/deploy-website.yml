name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'

jobs:
  trigger-coolify-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy webhook
        env:
          COOLIFY_WEBHOOK_WEBSITE_URL: ${{ vars.COOLIFY_WEBHOOK_WEBSITE_URL }}
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${COOLIFY_WEBHOOK_SECRET}" \
            "${COOLIFY_WEBHOOK_WEBSITE_URL}"
