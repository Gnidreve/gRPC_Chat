name: Build App

on:
  push:
    branches: [main]
    paths:
      - 'application/**'
      - '.github/workflows/build-app.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('application/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('application/android/**/*.gradle*', 'application/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # --build-number matches the release tag below (android-<run_number>)
      # so the in-app updater can compare versions with a plain integer
      # check instead of needing semver.
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: grpc-chat-android-${{ github.run_number }}
          path: application/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android build ${{ github.run_number }}
          files: application/build/app/outputs/flutter-apk/app-release.apk

  ios-build-check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: application
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      # No Apple signing credentials are configured in this repo, so this
      # only verifies the iOS build still compiles — it does not produce
      # an installable .ipa. Add certificates/provisioning profiles as
      # secrets and a codesigned `flutter build ipa` step to change that.
      - run: flutter build ios --release --no-codesign
