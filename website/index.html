<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proximity Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg-app: #ffffff;
      --text-primary: #111113;
      --text-secondary: #8a8a8f;
      --accent-green: #12b76a;
      --button-bg: #111113;
      --button-text: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .hero {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 24px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      visibility: hidden;
    }

    .status.ready {
      visibility: visible;
    }

    .status strong {
      font-weight: 600;
      color: var(--text-primary);
    }

    .dot-wrap {
      position: relative;
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .dot-wrap .pulse,
    .dot-wrap .dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--accent-green);
    }

    .dot-wrap .dot {
      width: 7px;
      height: 7px;
    }

    .dot-wrap .pulse {
      width: 7px;
      height: 7px;
      animation: pulse 2.2s ease-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(0.6);
        opacity: 0.35;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.9);
        opacity: 0;
      }
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }

    p.subtitle {
      margin: 16px 0 0;
      max-width: 32ch;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .download {
      margin-top: 36px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      border-radius: 100px;
      background: var(--button-bg);
      color: var(--button-text);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .download:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .download svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .hint {
      margin-top: 14px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <main class="hero">
    <div class="status" id="status">
      <div class="dot-wrap">
        <div class="pulse"></div>
        <div class="dot"></div>
      </div>
      <span><strong id="online-count">0</strong> online</span>
    </div>
    <h1>Proximity Chat</h1>
    <p class="subtitle">
      Ein schneller, einfacher Chat für uns. Jeder kriegt eine Farbe, kein
      Schnickschnack.
    </p>
    <a
      class="download"
      href="https://github.com/Gnidreve/gRPC_Chat/releases/latest/download/app-release.apk"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
      Für Android herunterladen
    </a>
    <p class="hint">Aktuell nur für Android · APK von GitHub Releases</p>
  </main>

  <script>
    // Same server the app talks to (application/lib/config/server_config.dart),
    // but over Coolify's regular HTTPS proxy domain rather than the direct
    // plaintext TCP port the app uses for gRPC — plain JSON over HTTPS works
    // fine through that proxy, no h2c workaround needed for this one route.
    const ONLINE_COUNT_URL = 'https://5plwpau6ymvvscimwhtsokxd.everding.it/api/online-count';
    const POLL_INTERVAL_MS = 15000;

    async function refreshOnlineCount() {
      try {
        const response = await fetch(ONLINE_COUNT_URL, { cache: 'no-store' });
        if (!response.ok) return;
        const data = await response.json();
        if (typeof data.online !== 'number') return;

        document.getElementById('online-count').textContent = data.online;
        document.getElementById('status').classList.add('ready');
      } catch {
        // No network / server unreachable: keep showing the last known
        // count (or stay hidden if we never got one) rather than error out.
      }
    }

    refreshOnlineCount();
    setInterval(refreshOnlineCount, POLL_INTERVAL_MS);
  </script>
</body>
</html>
