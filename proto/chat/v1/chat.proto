syntax = "proto3";

package chat.v1;

option go_package = "github.com/Gnidreve/gRPC_Chat/server/gen/chat/v1;chatv1";

import "google/protobuf/timestamp.proto";

// A chat participant. The client generates and persists id locally (so it
// survives app restarts) and sends it on every Join; nickname and color
// are chosen by the user themselves and do not need to be unique or real.
message User {
  string id = 1;
  string nickname = 2;
  string color = 3; // hex color, e.g. "#12B76A"
}

// A single chat message: who sent it, when, and the plain text body.
message ChatMessage {
  User user = 1;
  string text = 2;
  google.protobuf.Timestamp sent_at = 3;
}

message JoinRequest {
  string id = 1; // client-generated, persisted locally across restarts
  string nickname = 2;
  string color = 3; // hex color chosen by the user, e.g. "#12B76A"
}

message JoinResponse {
  User user = 1;
}

message SendMessageRequest {
  string user_id = 1;
  string text = 2;
}

message SendMessageResponse {
  ChatMessage message = 1;
}

message SubscribeRequest {
  string user_id = 1;
}

// How many participants currently have a live Subscribe stream open.
message PresenceUpdate {
  int32 online_count = 1;
}

// One item on the Subscribe stream: either a chat message or a presence
// (online count) update.
message ChatEvent {
  oneof event {
    ChatMessage message = 1;
    PresenceUpdate presence = 2;
  }
}

service ChatService {
  // Registers (or re-registers, across restarts) a participant with a
  // client-generated id and a client-chosen nickname and color.
  rpc Join(JoinRequest) returns (JoinResponse);

  // Sends a plain-text message to the room.
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);

  // Streams the full message history first, then every message and
  // presence change live from that point on.
  rpc Subscribe(SubscribeRequest) returns (stream ChatEvent);
}
